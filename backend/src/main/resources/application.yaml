spring:
  application:
    name: policypal
  datasource:
    url: jdbc:postgresql://localhost:5432/policypal
    username: ${DB_USERNAME:policypal}
    password: ${DB_PASSWORD:policypal}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    async:
      request-timeout: 120s
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b
        temperature: 0.0
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

management:
  endpoint:
    health:
      show-details: always
